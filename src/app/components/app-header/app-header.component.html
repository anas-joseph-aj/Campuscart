<header class="fixed top-0 left-0 right-0 z-50 w-full bg-white shrink-0" style="font-family: 'Inter', sans-serif;">
  <div class="h-[77px] px-6 md:px-8 flex items-center justify-between border-b-2 border-[#E5EFED]">
    
    <div class="flex items-center">
      <img src="assets/logo.png" alt="CampusCart" class="h-[40px] md:h-[45px] w-auto cursor-pointer" routerLink="/home">
    </div>

    <!-- Desktop Nav -->
    <nav class="hidden md:flex gap-8 text-[#717182] font-medium text-[15px]">
      <a routerLink="/home" routerLinkActive="text-[#26C0AB]" [routerLinkActiveOptions]="{exact: true}" class="cursor-pointer hover:text-[#26C0AB] transition-colors">Home</a>
      <a routerLink="/categories" routerLinkActive="text-[#26C0AB]" class="cursor-pointer hover:text-[#26C0AB] transition-colors">Categories</a>
      <a routerLink="/products" routerLinkActive="text-[#26C0AB]" class="cursor-pointer hover:text-[#26C0AB] transition-colors">All Products</a>
    </nav>

    <!-- Desktop Actions -->
    <div class="hidden md:flex items-center gap-6">
      
      <button routerLink="/sell" class="flex items-center gap-2 rounded-[8px] px-6 py-2.5 text-white font-semibold cursor-pointer hover:bg-[#20a896] transition-all" style="background-color: #26C0AB;">
        <span>+</span> Sell
      </button>
      
      <div class="flex items-center gap-5 text-[#717182]">
        <button (click)="onChat()" class="cursor-pointer hover:text-[#26C0AB] transition-colors">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
        </button>

        <a routerLink="/wishlist" class="cursor-pointer hover:text-[#26C0AB] transition-colors">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
        </a>

        <a routerLink="/profile" class="cursor-pointer hover:text-[#26C0AB] transition-colors">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path></svg>
        </a>
      </div>

      <button (click)="onLogout()" class="flex items-center gap-2 px-4 py-2 rounded-lg cursor-pointer bg-[#FFF5F5] text-[#FB2C36] hover:bg-[#FFE5E5] transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        <span class="font-semibold text-[14px]">Logout</span>
      </button>
    </div>

    <!-- Mobile Menu Button -->
    <div class="md:hidden flex items-center">
      <button (click)="toggleMobileMenu()" class="text-[#717182] hover:text-[#26C0AB] focus:outline-none">
        <svg *ngIf="!isMobileMenuOpen" class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        <svg *ngIf="isMobileMenuOpen" class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Menu -->
  <div *ngIf="isMobileMenuOpen" class="md:hidden absolute w-full bg-white border-b-2 border-[#E5EFED] shadow-lg flex flex-col items-center py-4 gap-4 z-40">
    <a routerLink="/home" routerLinkActive="text-[#26C0AB]" [routerLinkActiveOptions]="{exact: true}" (click)="toggleMobileMenu()" class="text-[#717182] font-medium text-[16px] hover:text-[#26C0AB] transition-colors">Home</a>
    <a routerLink="/categories" routerLinkActive="text-[#26C0AB]" (click)="toggleMobileMenu()" class="text-[#717182] font-medium text-[16px] hover:text-[#26C0AB] transition-colors">Categories</a>
    <a routerLink="/products" routerLinkActive="text-[#26C0AB]" (click)="toggleMobileMenu()" class="text-[#717182] font-medium text-[16px] hover:text-[#26C0AB] transition-colors">All Products</a>
    
    <div class="flex items-center gap-6 mt-2 text-[#717182]">
      <button (click)="onChat(); toggleMobileMenu()" class="hover:text-[#26C0AB] transition-colors">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
      </button>
      <a routerLink="/wishlist" (click)="toggleMobileMenu()" class="hover:text-[#26C0AB] transition-colors">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
      </a>
      <a routerLink="/profile" (click)="toggleMobileMenu()" class="hover:text-[#26C0AB] transition-colors">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path></svg>
      </a>
    </div>

    <button routerLink="/sell" (click)="toggleMobileMenu()" class="mt-2 flex items-center justify-center gap-2 rounded-[8px] w-48 py-2.5 text-white font-semibold cursor-pointer hover:bg-[#20a896] transition-all" style="background-color: #26C0AB;">
      <span>+</span> Sell
    </button>
    
    <button (click)="onLogout(); toggleMobileMenu()" class="mt-2 flex items-center justify-center gap-2 rounded-[8px] w-48 py-2.5 bg-[#FFF5F5] text-[#FB2C36] font-semibold cursor-pointer hover:bg-[#FFE5E5] transition-all">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
      <span>Logout</span>
    </button>
  </div>
</header>
