<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">

<div class="min-h-screen w-full bg-white flex flex-col p-6 select-none overflow-x-hidden" style="font-family: 'IBM Plex Serif', serif;">

  <div class="max-w-[1000px] w-full mx-auto border border-[#6FCF97] rounded-[24px] bg-white p-12 pt-16 flex flex-col items-center justify-center relative shadow-sm">
    
    <button (click)="goBack()" class="absolute top-6 left-8 flex items-center gap-2 text-[#717182] hover:text-[#26C0AB] transition-colors group focus:outline-none z-10">
      <svg class="w-4 h-4 transform group-hover:-translate-x-0.5 transition-transform" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
      </svg>
      <span class="font-semibold text-[15px]" style="font-family: 'Inter', sans-serif;">Back</span>
    </button>
    
    <div class="w-[84px] h-[84px] rounded-full bg-[#E8F8F5] flex items-center justify-center text-[#26C0AB] mb-5 shrink-0">
      <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="18" cy="5" r="3" />
        <circle cx="6" cy="12" r="3" />
        <circle cx="18" cy="19" r="3" />
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
      </svg>
    </div>

    <h1 class="text-[36px] font-bold text-black mb-2 text-center select-none">
      Share
    </h1>
    <p class="text-[18px] font-normal text-[#717182] mb-10 text-center max-w-lg select-none">
      Share great finds with your friends and classmates
    </p>

    <div class="w-full max-w-[720px] border border-[#CBD5E1] rounded-[20px] p-6 mb-8 bg-white shadow-sm flex flex-col justify-center">
      <label class="text-[17px] font-medium text-black mb-3 select-none">Product link</label>
      <div class="w-full h-[54px] border border-[#CBD5E1] rounded-[14px] bg-white flex items-center p-1 overflow-hidden">
        <input type="text" readonly [value]="productLink" class="flex-1 bg-transparent px-4 text-[15px] font-normal text-gray-700 outline-none border-none select-all" style="font-family: 'Inter', sans-serif;">
        
        <button (click)="copyLinkToClipboard()" 
                [ngClass]="isCopied ? 'bg-[#26C0AB] hover:bg-[#1fa391]' : 'bg-[#26C0AB] hover:bg-[#1fa391]'"
                class="h-full px-6 rounded-[11px] text-white font-medium text-[15px] flex items-center gap-2 transition-all shrink-0 min-w-[110px] justify-center active:scale-95" 
                style="font-family: 'Inter', sans-serif;">
          
          <svg *ngIf="!isCopied" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
          </svg>
          <svg *ngIf="isCopied" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
          </svg>
          
          <span>{{ isCopied ? 'Copied!' : 'Copy' }}</span>
        </button>
      </div>
    </div>

    <div class="w-full max-w-[720px] flex items-center justify-center gap-4 mb-10 select-none">
      <div class="flex-1 h-[1px] bg-[#E5E7EB]"></div>
      <span class="text-[15px] text-[#717182] font-normal tracking-wide" style="font-family: 'Inter', sans-serif;">or share using</span>
      <div class="flex-1 h-[1px] bg-[#E5E7EB]"></div>
    </div>

    <div class="w-full max-w-[620px] grid grid-cols-5 gap-4 justify-items-center mb-12">
      <button (click)="shareToSocial('whatsapp')" class="flex flex-col items-center gap-3 group focus:outline-none">
        <div class="w-[58px] h-[58px] rounded-full bg-[#E8F8F5] flex items-center justify-center text-[#2ECC71] shadow-sm group-hover:scale-105 transition-transform">
          <i class="fab fa-whatsapp text-[28px]"></i>
        </div>
        <span class="text-[14px] text-black font-medium group-hover:text-[#26C0AB] transition-colors">Whatsapp</span>
      </button>

      <button (click)="shareToSocial('facebook')" class="flex flex-col items-center gap-3 group focus:outline-none">
        <div class="w-[58px] h-[58px] rounded-full bg-[#EBF5FB] flex items-center justify-center text-[#2980B9] shadow-sm group-hover:scale-105 transition-transform">
          <i class="fab fa-facebook-f text-[24px]"></i>
        </div>
        <span class="text-[14px] text-black font-medium group-hover:text-[#26C0AB] transition-colors">Facebook</span>
      </button>

      <button (click)="shareToSocial('instagram')" class="flex flex-col items-center gap-3 group focus:outline-none">
        <div class="w-[58px] h-[58px] rounded-full bg-[#FDF2F8] flex items-center justify-center text-[#E1306C] shadow-sm group-hover:scale-105 transition-transform">
          <i class="fab fa-instagram text-[26px]"></i>
        </div>
        <span class="text-[14px] text-black font-medium group-hover:text-[#26C0AB] transition-colors">Instagram</span>
      </button>

      <button (click)="shareToSocial('gmail')" class="flex flex-col items-center gap-3 group focus:outline-none">
        <div class="w-[58px] h-[58px] rounded-full bg-[#FDEDEC] flex items-center justify-center text-[#E74C3C] shadow-sm group-hover:scale-105 transition-transform">
          <i class="far fa-envelope text-[24px]"></i>
        </div>
        <span class="text-[14px] text-black font-medium group-hover:text-[#26C0AB] transition-colors">Gmail</span>
      </button>

      <button (click)="shareToSocial('more')" class="flex flex-col items-center gap-3 group focus:outline-none">
        <div class="w-[58px] h-[58px] rounded-full bg-[#F2F3F4] flex items-center justify-center text-[#717182] shadow-sm group-hover:scale-105 transition-transform">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 10a2 2 0 11-4 0 2 2 0 014 0zM14 10a2 2 0 11-4 0 2 2 0 014 0zM22 10a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
        </div>
        <span class="text-[14px] text-black font-medium group-hover:text-[#26C0AB] transition-colors">More</span>
      </button>
    </div>

    <div class="w-full max-w-[720px] rounded-[16px] p-5 flex items-center gap-5 select-none" style="background-color: #EBF9F6;">
      <div class="w-[54px] h-[54px] bg-transparent flex items-center justify-center text-[#26C0AB] shrink-0 pl-1">
        <svg class="w-[46px] h-[46px]" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M12 9.5c0 0-2.5-1.2-4.2-2.8c-1.5-1.4-1.1-3.4 0.6-3.7c1.8-0.3 3.6 1.8 3.6 3.7c0 0.9 0 2.8 0 2.8z" />
          <path d="M12 9.5c0 0 2.5-1.2 4.2-2.8c1.5-1.4 1.1-3.4-0.6-3.7c-1.8-0.3-3.6 1.8-3.6 3.7c0 0.9 0 2.8 0 2.8z" />
          <rect x="4" y="9.5" width="16" height="2.8" rx="1.2" />
          <path d="M5.5 12.3v6.4c0 1.2 0.8 1.8 1.8 1.8h9.4c1 0 1.8-0.6 1.8-1.8v-6.4" />
          <path d="M12 12.3v8" />
        </svg>
      </div>
      <div class="flex flex-col justify-center">
        <span class="text-[17px] font-bold text-black tracking-wide">Share with friends!</span>
        <span class="text-[14px] font-normal text-[#717182] mt-0.5" style="font-family: 'Inter', sans-serif;">Help your friends discover great products on CampusCart.</span>
      </div>
    </div>

  </div>

  <div class="max-w-[1000px] w-full mx-auto mt-6 grid grid-cols-3 gap-6 items-center select-none">
    
    <div class="flex items-center gap-4">
      <div class="shrink-0 flex items-center justify-center">
        <svg class="w-[52px] h-[52px] text-[#26C0AB]" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"
             style="filter: drop-shadow(2px 5px 4px rgba(38,192,171,0.28)) drop-shadow(1px 3px 2px rgba(0,0,0,0.12));">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          <path d="M9 11l2 2 4-4" />
        </svg>
      </div>
      <div class="flex flex-col">
        <span class="text-[20px] font-semibold text-black tracking-tight leading-tight">Safe & Secure</span>
        <span class="text-[14px] text-[#8A8A9E] font-normal mt-0.5" style="font-family: 'Inter', sans-serif;">Your safety is our priority</span>
      </div>
    </div>

    <div class="flex items-center gap-4">
      <div class="shrink-0 flex items-center justify-center">
        <svg class="w-[52px] h-[52px] text-[#26C0AB]" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"
             style="filter: drop-shadow(2px 5px 4px rgba(38,192,171,0.28)) drop-shadow(1px 3px 2px rgba(0,0,0,0.12));">
          <circle cx="18" cy="6" r="2.5" />
          <circle cx="6" cy="12" r="2.5" />
          <circle cx="18" cy="18" r="2.5" />
          <line x1="8.35" y1="13.18" x2="15.65" y2="16.82" />
          <line x1="15.65" y1="7.18" x2="8.35" y2="10.82" />
        </svg>
      </div>
      <div class="flex flex-col">
        <span class="text-[20px] font-semibold text-black tracking-tight leading-tight">Easy Sharing</span>
        <span class="text-[14px] text-[#8A8A9E] font-normal mt-0.5" style="font-family: 'Inter', sans-serif;">Share products quickly and easily</span>
      </div>
    </div>

    <div class="flex items-center gap-4">
      <div class="shrink-0 flex items-center justify-center">
        <svg class="w-[52px] h-[52px] text-[#26C0AB]" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"
             style="filter: drop-shadow(2px 5px 4px rgba(38,192,171,0.28)) drop-shadow(1px 3px 2px rgba(0,0,0,0.12));">
          <circle cx="12" cy="12" r="9" />
          <path d="M13 7l-4 6h3v4l4-6h-3V7z" fill="currentColor" />
        </svg>
      </div>
      <div class="flex flex-col">
        <span class="text-[20px] font-semibold text-black tracking-tight leading-tight">Quick Access</span>
        <span class="text-[14px] text-[#8A8A9E] font-normal mt-0.5" style="font-family: 'Inter', sans-serif;">Access shared products quickly</span>
      </div>
    </div>

  </div>

</div>
