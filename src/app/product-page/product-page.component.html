<div class="h-screen w-full bg-white flex flex-col select-none overflow-hidden">

  <app-header></app-header>

  <div class="w-full flex flex-1 min-h-0 mt-[77px]">

    <aside
      class="group w-[80px] hover:w-[260px] bg-[#2BAE96] flex flex-col pt-6 shrink-0 overflow-y-auto transition-all duration-300 ease-in-out z-20 shadow-md">

      <div
        class="w-full px-4 mb-5 text-center group-hover:text-left group-hover:px-6 transition-all duration-300 overflow-hidden shrink-0">
        <span class="text-white/80 text-[11px] font-bold tracking-widest uppercase block truncate"
          style="font-family: 'Inter', sans-serif;">
          Categories
        </span>
      </div>

      <div class="flex flex-col text-white gap-1" style="font-family: 'IBM Plex Serif', serif;">

        <button (click)="selectCategory('All Products')"
          [class]="selectedCategory === 'All Products' ? 'bg-white/95 text-[#2BAE96] font-medium shadow-sm mr-4 rounded-r-[12px] pl-6' : 'hover:bg-white/10 mr-4 rounded-r-[12px] pl-6 text-white/90'"
          class="text-left py-3 min-h-[48px] flex items-center transition-all duration-150 overflow-hidden relative">

          <div
            class="flex-1 flex justify-between items-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 pr-4 whitespace-nowrap">
            <span>All Products</span>
            <div *ngIf="selectedCategory === 'All Products'" class="flex items-center gap-2">
              <span class="bg-[#2BAE96] text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full font-sans">
                {{ getCategoryCount('All Products') }}
              </span>
              <span class="text-[#2BAE96] text-[13px] font-bold font-sans">&gt;</span>
            </div>
          </div>
        </button>

        <button *ngFor="let cat of categories" (click)="selectCategory(cat.name)"
          [class]="selectedCategory === cat.name ? 'bg-white/95 text-[#2BAE96] font-medium shadow-sm mr-4 rounded-r-[12px]' : 'hover:bg-white/10 mr-4 rounded-r-[12px] text-white/90'"
          class="text-left py-3 min-h-[48px] flex items-center transition-all duration-150 overflow-hidden relative group/btn">

          <div
            class="w-[80px] group-hover:w-[44px] shrink-0 flex items-center justify-center group-hover:pl-6 transition-all duration-300">
            <img [src]="cat.icon" [alt]="cat.name"
              [class]="selectedCategory === cat.name ? 'w-9 h-9 object-contain transition-transform duration-200 group-hover/btn:scale-110 filter hue-rotate-[140deg] saturate-[1.5] brightness-[0.7]' : 'w-9 h-9 object-contain transition-transform duration-200 group-hover/btn:scale-110 filter brightness-0 invert'">
          </div>

          <div
            class="flex-1 flex justify-between items-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 pr-4 whitespace-nowrap pl-2">
            <span>{{ cat.name }}</span>
            <div *ngIf="selectedCategory === cat.name" class="flex items-center gap-2">
              <span class="bg-[#2BAE96] text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full font-sans">
                {{ getCategoryCount(cat.name) }}
              </span>
              <span class="text-[#2BAE96] text-[13px] font-bold font-sans">&gt;</span>
            </div>
          </div>
        </button>

      </div>
    </aside>

    <main class="flex-1 bg-white flex flex-col p-10 overflow-y-auto min-w-0">

      <div *ngIf="filteredProducts.length === 0"
        class="flex-1 flex flex-col items-center justify-center py-12 bg-white animate-fade-in">

        <img src="assets/empty.png" alt="No items Available" class="max-w-[400px] h-auto object-contain mb-6">

        <h2 class="text-[#101828] font-bold text-[32px] mb-3 text-center" style="font-family: 'IBM Plex Serif', serif;">
          No items Available
        </h2>

        <p class="text-[#718096] text-[16px] text-center max-w-[480px] leading-relaxed"
          style="font-family: 'Inter', sans-serif;">
          We couldn't find any items in this category right now.<br>
          Try exploring other categories or check back later.
        </p>
      </div>

      <div *ngIf="filteredProducts.length > 0" class="flex flex-col h-full">

        <div class="flex justify-between items-center mb-8 shrink-0">
          <h1 class="text-[32px] font-bold text-[#1F2937]" style="font-family: 'IBM Plex Serif', serif;">
            {{ selectedCategory }}
          </h1>

          <div class="relative w-[320px]" style="font-family: 'Inter', sans-serif;">
            <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M4 6h16M4 12h16M4 18h7"></path>
              </svg>
            </span>
            <input type="text" [(ngModel)]="searchQuery" (ngModelChange)="onSearchChange($event)" placeholder="Search products..."
              class="w-full bg-[#F9FAFB] border border-gray-200 rounded-lg pl-10 pr-8 py-2.5 text-[14px] focus:outline-none focus:border-[#2BAE96]">
            <span class="absolute inset-y-0 right-3 flex items-center text-gray-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
              </svg>
            </span>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-2 lg:grid-cols-3 gap-8">
          <div *ngFor="let product of filteredProducts"
            class="bg-white rounded-[18px] border-2 border-[#2BAE96]/30 overflow-hidden flex flex-col hover:border-[#2BAE96] transition-all duration-200 hover:shadow-sm cursor-pointer"
            (click)="navigateToProduct(product.id)">

            <div class="w-full aspect-[4/3] relative overflow-hidden flex items-center justify-center p-6 bg-white">
              <img [src]="product.image" [alt]="product.name" class="max-h-full max-w-full object-contain" [ngClass]="{'opacity-60 grayscale-[50%]': product.sold}">
              <div *ngIf="product.sold" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-red-500/90 text-white font-bold py-1.5 px-6 rounded-lg rotate-[-15deg] shadow-lg z-10 text-[20px] uppercase tracking-widest backdrop-blur-sm border border-red-400">
                Sold
              </div>

              <button (click)="toggleLike(product, $event)"
                [ngClass]="product.liked ? 'border-transparent focus:outline-none focus:ring-0' : 'border border-gray-100 focus:outline-none focus:ring-0'"
                class="absolute top-4 right-4 w-8 h-8 rounded-full bg-white shadow-sm flex items-center justify-center transition-transform active:scale-95"
                style="outline: none; box-shadow: none;">
                <svg class="w-4 h-4 transition-colors" [attr.fill]="product.liked ? '#FB2C36' : 'none'"
                  [attr.stroke]="product.liked ? '#FB2C36' : '#9CA3AF'" stroke-width="2" viewBox="0 0 24 24">
                  <path
                    d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z">
                  </path>
                </svg>
              </button>
            </div>

            <div class="p-6 flex flex-col gap-2 bg-white border-t border-gray-50 flex-1 justify-between">
              <h4 class="text-[#1F2937] font-medium text-[16px] tracking-tight"
                style="font-family: 'IBM Plex Serif', serif;">{{ product.name }}</h4>

              <span *ngIf="product.price && !product.sold" class="text-[16px] font-semibold text-[#2BAE96]"
                style="font-family: 'Inter', sans-serif;">
                ₹{{ product.price }}
              </span>
              <span *ngIf="product.sold" class="text-[16px] font-bold text-red-500"
                style="font-family: 'Inter', sans-serif;">
                Sold Out
              </span>
            </div>

          </div>
        </div>

      </div>

    </main>
  </div>

</div>
