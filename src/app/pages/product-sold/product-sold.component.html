<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<div class="h-screen w-full bg-white flex flex-col select-none overflow-y-auto pt-[77px]" style="font-family: 'IBM Plex Serif', serif;">

    <app-header></app-header>

    <main class="flex-1 px-16 py-8 max-w-[1440px] mx-auto w-full space-y-6">

        <button (click)="goBack()" class="flex items-center gap-2 text-[#6C757D] hover:text-black transition-colors" style="font-family: 'IBM Plex Serif', serif; font-weight: 600; font-size: 18px;">
            <span style="font-weight: 400; font-size: 20px; position: relative; top: -1px;">&larr;</span> Back
        </button>

        <div class="space-y-1">
            <h1 class="text-[36px] font-extrabold text-black tracking-tight">My Sold Products</h1>
            <p class="text-[#8A92A6] text-[18px] font-medium tracking-normal">View all the products you have sold</p>
        </div>

        <div class="w-full flex justify-between items-center pt-4">
            <div class="flex gap-4">
                <button class="bg-[#EEF7F5] border border-[#26C0AB66] px-6 py-2.5 rounded-[12px] cursor-pointer transition-all shrink-0 flex items-center justify-center h-[52px]" style="font-family: 'IBM Plex Serif', serif; font-weight: 400; font-size: 24px; line-height: 100%; color: #26C0AB; letter-spacing: 0%;">
                    Sold ({{ soldProducts.length }})
                </button>
            </div>

            <div class="relative" style="font-family: 'Inter', sans-serif;">
                <button (click)="toggleDropdown($event)" class="bg-white border border-gray-200 rounded-[12px] pl-5 pr-12 py-3 text-gray-500 font-medium text-[15px] outline-none cursor-pointer flex items-center justify-between min-w-[185px] hover:bg-gray-50 transition-colors">
                    <span class="whitespace-nowrap">{{ selectedSortLabel }}</span>
                    <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-gray-400">
                        <svg class="w-4 h-4 transition-transform duration-200" [class.rotate-180]="isDropdownOpen" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                        </svg>
                    </div>
                </button>

                <div *ngIf="isDropdownOpen" class="absolute right-0 mt-2 min-w-full w-max bg-white border border-gray-200 rounded-[12px] shadow-lg overflow-hidden z-50 animate-in fade-in slide-in-from-top-2 duration-100">
                    <ul class="py-1 text-[15px] font-medium text-gray-600 whitespace-nowrap">
                        <li (click)="selectSortOption('newest', 'Newest First')" [ngClass]="{'bg-[#EEF7F5] text-[#2FA084]': selectedSortOption === 'newest'}" class="px-5 py-2.5 hover:bg-gray-50 cursor-pointer transition-colors">
                            Newest First
                        </li>
                        <li (click)="selectSortOption('low-high', 'Price: Low to High')" [ngClass]="{'bg-[#EEF7F5] text-[#2FA084]': selectedSortOption === 'low-high'}" class="px-5 py-2.5 hover:bg-gray-50 cursor-pointer transition-colors">
                            Price: Low to High
                        </li>
                        <li (click)="selectSortOption('high-low', 'Price: High to Low')" [ngClass]="{'bg-[#EEF7F5] text-[#2FA084]': selectedSortOption === 'high-low'}" class="px-5 py-2.5 hover:bg-gray-50 cursor-pointer transition-colors">
                            Price: High to Low
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <div *ngIf="soldProducts.length > 0" class="grid grid-cols-3 gap-8 pt-4">
            <div *ngFor="let item of soldProducts" class="border border-gray-200 rounded-[18px] bg-white p-5 h-[340px] flex flex-col justify-between relative transform hover:-translate-y-1 transition-all duration-200 overflow-visible max-w-[320px]">

                <span class="absolute top-5 left-5 text-[12px] font-medium tracking-normal px-3 py-1 rounded-[8px] bg-gray-100 text-gray-500" style="font-family: 'Inter', sans-serif;">
                    Sold
                </span>

                <div class="h-[140px] w-full flex items-center justify-center p-2 mt-8 bg-white rounded-xl">
                    <img [src]="item.image" [alt]="item.title" class="max-h-full max-w-full object-contain">
                </div>

                <div class="space-y-1 px-1">
                    <h3 class="text-black text-[15px] font-bold tracking-tight line-clamp-1">{{ item.title }}</h3>
                    <div class="text-[#2FA084] font-bold text-[15px]">{{ item.priceDisplay || ('₹' + (item.price | number)) }}</div>
                </div>

                <div class="w-full pt-1" style="font-family: 'Inter', sans-serif;">
                    <div class="w-full h-[40px] rounded-[10px] bg-[#E9ECEF] text-[#495057] flex items-center justify-center gap-2 px-3 text-[13px] font-semibold">
                        <svg class="w-4 h-4 text-[#6C757D]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                        </svg>
                        Sold on {{ item.deactivateDate }} 
                    </div>
                </div>

            </div>
        </div>

        <div *ngIf="soldProducts.length === 0" class="flex flex-col items-center justify-center py-20 w-full text-center">
            <div class="w-64 h-64 mb-4 flex items-center justify-center">
                <img src="assets/noproductssold.png" alt="No products sold yet" class="max-h-full max-w-full object-contain">
            </div>
            <h2 class="text-[32px] font-extrabold text-black mb-1">No sold products yet</h2>
            <p class="text-[#8A92A6] text-[16px] font-medium">Your completed sales will appear here.</p>
        </div>

    </main>

</div>
