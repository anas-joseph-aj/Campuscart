

<div
  style="width: 100%; min-height: 100vh; background: #FAFAFA; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; padding: 117px 10px 40px; box-sizing: border-box; font-family: 'IBM Plex Serif', serif;">
  

  <div class="card-container">

    <!-- Illustration -->
    <img src="assets/feedback.png" alt="Feedback Submitted Successfully"
      style="width: 100%; max-width: 500px; height: auto; display: block; margin: 0 auto;">

    <!-- Text Content -->
    <div style="width: 100%; display: flex; flex-direction: column; align-items: center; margin: 15px 0;">
      <h1
        style="font-size: 32px; font-weight: 600; color: #000000; margin-bottom: 20px; margin-top: 0; line-height: 1.25;">
        Feedback Submitted Successfully!</h1>

      <p style="font-size: 18px; color: #717182; margin: 0; line-height: 1.6; font-weight: 400;">
        Thank you for sharing your thoughts and suggestions.<br>
        Your feedback has been received and<br>
        will help us create a better experience.
      </p>
    </div>

    <!-- Action Group (Divider + Buttons) -->
    <div style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 35px;">
      <hr style="width: 100%; border: none; border-top: 1px solid #E5EFED; margin: 0;">

      <!-- Action Buttons -->
      <div style="display: flex; gap: 40px; justify-content: center; width: 100%; flex-wrap: wrap;">
        <button routerLink="/home" class="btn-primary">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          Back to Home
        </button>
        <button routerLink="/feedback" class="btn-secondary">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
          </svg>
          Submit Another Feedback
        </button>
      </div>
    </div>
  </div>
</div>
