<div class="w-full min-h-screen bg-[#FAFAFA] pb-10 pt-[77px]" style="font-family: 'IBM Plex Sans', sans-serif;">
  <app-header></app-header>
  <div class="w-full flex flex-col items-center pt-[130px]">
    <div class="flex flex-col items-center text-center max-w-2xl mx-auto">
      <h1 class="text-4xl font-bold text-gray-900">Products</h1>
      <p class="mt-4 text-gray-600">Browse our latest products.</p>
    </div>
    <div class="mt-8 w-full flex justify-center">
      <img src="assets/home.png" alt="Products" class="max-w-full h-64 object-cover rounded-lg shadow-lg" />
    </div>
    <div class="mt-8 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 w-full max-w-5xl">
      <div *ngFor="let product of products" class="bg-white rounded-lg shadow hover:shadow-lg transition-shadow p-4 cursor-pointer" (click)="viewProduct(product.id)">
        <img *ngIf="product.image" [src]="product.image" alt="{{product.name}}" class="h-40 w-full object-cover rounded" />
        <h2 class="mt-2 text-xl font-semibold text-gray-800">{{product.name}}</h2>
        <button (click)="reportSeller(product)" class="mt-1 text-sm text-[#26C0AB] hover:underline">Report Seller</button>
        <p class="text-gray-600">{{product.companyName}}</p>
        <p class="mt-1 text-lg font-bold text-indigo-600">{{product.price | currency}}</p>
      </div>
    </div>
  </div>
</div>
