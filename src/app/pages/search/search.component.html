<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500;600&display=swap" rel="stylesheet">

<app-header></app-header>

<div class="w-full h-[2px] bg-[#2BAE96]"></div>

<div class="w-full flex-1 min-h-0 bg-white flex flex-col items-center justify-start py-14 px-4 overflow-y-auto">
    
    <div class="w-full max-w-[854px] bg-white border border-[#26C0AB] rounded-[18px] p-10 flex flex-col gap-6">
      
      <div class="w-full h-[66px] flex items-center border border-[#26C0AB] rounded-[14px] px-5 bg-white transition-all">
        <svg class="w-5 h-5 text-gray-400 mr-3 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <input 
          type="text" 
          [formControl]="searchControl"
          (keyup.enter)="triggerSearch()"
          placeholder="Search for Books, laptops, clothes and more..." 
          class="w-full h-full bg-transparent text-gray-700 placeholder-gray-400 text-[15px] focus:outline-none pr-4 font-sans"
        />
        <button (click)="triggerSearch()" class="h-[44px] px-6 bg-[#26C0AB] hover:bg-[#1fa391] text-white font-medium rounded-lg text-sm shrink-0 transition-colors font-sans">
          Search
        </button>
      </div>

      <div class="w-full">
        
        <ng-container *ngIf="!searchActive && recentSearches.length === 0">
          <div class="w-full flex flex-col items-center justify-center pt-6 pb-4 text-center animate-fade-in">
            <img src="assets/searchicon.png" alt="Search Illustration" class="w-[96px] h-[96px] object-contain mb-5 select-none" />
            
            <h3 class="text-[32px] font-[500] text-[#1F2937] tracking-tight mb-2" style="font-family: 'IBM Plex Serif', serif;">Start Exploring</h3>
            
            <div class="w-full max-w-[499px] min-h-[60px] flex items-center justify-center mb-4">
              <p class="text-[24px] font-[500] text-center text-[#6C757D]" style="font-family: 'IBM Plex Serif', serif; line-height: 28px;">
                Search for products categories or keywords to get started.
              </p>
            </div>
            
            <div class="w-full flex items-center justify-center gap-4 my-4">
              <div class="h-[1px] w-16 bg-gray-200"></div>
              <span class="text-[14px] text-gray-400 font-medium lowercase" style="font-family: 'IBM Plex Serif', serif;">or</span>
              <div class="h-[1px] w-16 bg-gray-200"></div>
            </div>
          </div>
        </ng-container>

        <ng-container *ngIf="!searchActive && recentSearches.length > 0">
          <div class="border border-gray-200/80 rounded-xl mb-6 overflow-hidden bg-white shadow-xs" style="font-family: 'Inter', sans-serif;">
            <div class="flex justify-between items-center px-5 py-4 border-b border-gray-100 bg-gray-50/40">
              <div class="flex items-center text-gray-700 font-semibold text-sm gap-2">
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                Recent Searches
              </div>
              <button (click)="clearAllRecent()" class="text-xs text-red-500 hover:text-red-700 font-bold tracking-wide transition-colors">
                Clear All
              </button>
            </div>
            
            <ul class="divide-y divide-gray-100">
              <li *ngFor="let item of recentSearches; let i = index" 
                  (click)="selectKeyword(item)"
                  class="flex justify-between items-center px-5 py-3.5 text-sm text-gray-600 hover:bg-gray-50/80 cursor-pointer transition-colors group">
                <div class="flex items-center gap-3">
                  <svg class="w-4 h-4 text-gray-300 group-hover:text-[#26C0AB]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                  </svg>
                  <span class="capitalize text-gray-700 font-medium">{{ item }}</span>
                </div>
                <button (click)="removeRecentItem(i, $event)" class="text-gray-400 hover:text-red-500 p-1 transition-colors">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
              </li>
            </ul>
          </div>
        </ng-container>

        <ng-container *ngIf="searchActive">
          <div class="mb-5 flex justify-between items-center" style="font-family: 'Inter', sans-serif;">
            <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Matches for "{{ currentQuery }}"</span>
            <button (click)="resetToSplash()" class="text-xs text-[#2BAE96] font-medium hover:underline">Reset View</button>
          </div>

          <div *ngIf="filteredProducts.length === 0" class="w-full py-14 flex flex-col items-center justify-center border border-dashed border-gray-200 rounded-[14px] mb-6">
            <p class="text-gray-400 font-medium text-sm" style="font-family: 'Inter', sans-serif;">No products match your current search criteria.</p>
          </div>

          <div *ngIf="filteredProducts.length > 0" class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-6">
            <div *ngFor="let product of filteredProducts" 
                 (click)="navigateToProduct(product.id)"
                 class="bg-white rounded-xl border border-gray-200 p-4 flex gap-4 hover:border-[#26C0AB] transition-all duration-200 cursor-pointer shadow-xs">
              <div class="w-20 h-20 bg-gray-50 rounded-lg overflow-hidden flex items-center justify-center p-2 shrink-0">
                <img [src]="product.image" alt="Product thumbnail" class="max-h-full max-w-full object-contain">
              </div>
              <div class="flex flex-col justify-between overflow-hidden py-1">
                <div>
                  <h4 class="text-[#1F2937] font-semibold text-sm truncate" style="font-family: 'IBM Plex Serif', serif;">{{ product.name }}</h4>
                  <p class="text-xs text-gray-400 font-medium mt-0.5 capitalize">{{ product.category }}</p>
                </div>
                <span class="text-sm font-bold text-[#2BAE96]" style="font-family: 'Inter', sans-serif;">{{ product.price }}</span>
              </div>
            </div>
          </div>
        </ng-container>

        <div class="w-full border border-gray-200/70 rounded-[16px] p-6 bg-white mt-2">
          <div class="flex items-center text-gray-400 font-bold text-xs tracking-wider uppercase mb-4 gap-2" style="font-family: 'Inter', sans-serif;">
            <svg class="w-4 h-4 text-[#26C0AB]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18L9 11.25l4.306 4.307a11.95 11.95 0 015.814-5.519l2.74-1.22m0 0l-5.94-2.28m5.94 2.28l-2.28 5.941"></path>
            </svg>
            Popular Searches
          </div>
          
          <div class="flex flex-wrap gap-3" style="font-family: 'Inter', sans-serif;">
            <button 
              *ngFor="let keyword of popularSearches"
              (click)="selectKeyword(keyword)"
              class="w-[105.29px] h-[50px] rounded-[16px] bg-[#EEF7F5] border border-[#26C0AB]/30 hover:border-[#26C0AB] text-[#26C0AB] font-semibold text-sm transition-all duration-150 text-center truncate capitalize focus:outline-none">
              {{ keyword }}
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>
