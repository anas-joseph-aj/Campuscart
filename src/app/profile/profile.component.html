<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;500;600;700&display=swap" rel="stylesheet">

<div class="h-screen w-full bg-white flex flex-col select-none overflow-y-auto">
  
  <header class="w-full h-[77px] px-12 flex items-center justify-between border-b-2 border-[#6FCF97] bg-white shrink-0" style="font-family: 'Inter', sans-serif;">
    <div class="flex items-center">
      <img src="assets/logo.png" alt="CampusCart" class="h-[50px] w-auto">
    </div>

    <nav class="flex gap-8 text-[#6C757D] font-medium text-[14px]">
      <a href="#" class="hover:text-[#2FA084]">Home</a>
      <a href="#" class="hover:text-[#2FA084]">Categories</a>
      <a href="#" class="hover:text-[#2FA084]">All Products</a>
    </nav>

    <div class="flex items-center gap-6">
      <button class="flex items-center gap-2 rounded-[6px] px-6 py-2 text-white font-medium cursor-pointer hover:opacity-90 transition-opacity" style="background-color: #26C0AB;">
        <span class="text-[18px]">+</span> Sell
      </button>
      
      <div class="flex items-center gap-4 text-[#6C757D]">
        <button class="cursor-pointer hover:text-[#2FA084]"><svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg></button>
        <button class="cursor-pointer hover:text-[#2FA084]"><svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg></button>
        <button (click)="isEditMode = true" class="cursor-pointer hover:text-[#2FA084]">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </button>
      </div>

      <button class="flex items-center gap-2 px-4 py-2 rounded-lg cursor-pointer hover:opacity-80" style="background-color: #FFC9C9; color: #FB2C36;">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        <span class="font-semibold text-[14px]">Logout</span>
      </button>
    </div>
  </header>

  <ng-container *ngIf="isEditMode">
    <input type="file" #fileInput class="hidden" accept="image/*" (change)="onFileSelected($event)">

    <div class="w-full flex-1 flex justify-center items-center gap-[120px] px-12 py-4" style="font-family: 'IBM Plex Serif', serif;">
      
      <div class="w-[320px] h-[320px] relative shrink-0 flex items-center justify-center">
        <div class="w-full h-full bg-[#FDEEED] rounded-full overflow-hidden flex items-center justify-center relative border-2 border-[#2FA08420]">
          <img *ngIf="profileImageUrl" [src]="profileImageUrl" class="w-full h-full object-cover">
          <img *ngIf="!profileImageUrl" src="assets/profile.png" class="w-full h-full object-cover" style="transform: scale(1.1) translateY(12px);" alt="Profile Default">
        </div>
        
        <button type="button" (click)="triggerGallery(fileInput)" class="absolute bottom-[-15px] left-1/2 -translate-x-1/2 w-[76px] h-[76px] bg-white rounded-full flex items-center justify-center z-30 transition-transform active:scale-95 cursor-pointer">
          <svg class="w-[34px] h-[34px] text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 47.774 47.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Z" />
          </svg>
        </button>
      </div>

      <div class="space-y-[24px] shrink-0">
        <div class="flex items-center">
          <label class="w-[300px] text-[32px] font-medium text-[#000000]">Name</label>
          <input #nameInput [value]="userName" type="text" placeholder="Enter Your Name" class="w-[474px] h-[64px] px-6 text-[20px] rounded-[18px] border-2 border-[#2FA084] bg-[#EEF7F5] outline-none">
        </div>
        
        <div class="flex items-center">
          <label class="w-[300px] text-[32px] font-medium text-[#000000]">Department</label>
          <input #deptInput [value]="userDept" type="text" placeholder="Computer Science UG" class="w-[474px] h-[64px] px-6 text-[20px] rounded-[18px] border-2 border-[#2FA084] bg-[#EEF7F5] outline-none">
        </div>

        <div class="flex flex-col">
          <div class="flex items-center">
            <label class="w-[300px] text-[32px] font-medium text-[#000000]">Roll No /Id</label>
            <input #rollInput [value]="userRoll" type="text" placeholder="Enter Your Roll No /Id" class="w-[474px] h-[64px] px-6 text-[20px] rounded-[18px] border-2 border-[#2FA084] bg-[#EEF7F5] outline-none">
          </div>
          
          <div class="w-[474px] ml-[300px] h-[40px] flex items-center mt-1">
            <p *ngIf="message" [style.color]="isError ? '#FB2C36' : '#1F6F5F'" class="font-medium text-[20px]">
              {{ message }}
            </p>
          </div>
        </div>
      </div>
    </div>

    <div class="w-full h-[110px] flex items-center justify-center border-t-2 border-[#6FCF975C] shrink-0">
      <button type="button" (click)="saveProfile(nameInput.value, deptInput.value, rollInput.value)" class="text-white text-[24px] font-medium w-[198px] h-[64px] rounded-[25px] cursor-pointer hover:opacity-90 transition-opacity shadow-sm" style="background-color: #2FA084;">Save</button>
    </div>
  </ng-container>

  <ng-container *ngIf="!isEditMode">
    <!-- Hidden input referenced by template local reference variable -->
    <input type="file" #fileInput class="hidden" accept="image/*" (change)="onFileSelected($event)">

    <main class="flex-1 px-24 py-8 space-y-8 max-w-[1440px] mx-auto w-full">
      
      <section class="w-full border border-[#2FA0844D] bg-white rounded-[24px] px-14 py-11 flex items-center gap-14 relative shadow-sm">
        
        <div class="w-[280px] h-[280px] relative shrink-0 flex items-center justify-center">
          <div class="w-full h-full bg-[#FDEEED] rounded-full overflow-hidden flex items-center justify-center relative border border-gray-100">
            <img *ngIf="profileImageUrl" [src]="profileImageUrl" class="w-full h-full object-cover rounded-full">
            <img *ngIf="!profileImageUrl" src="assets/profile.png" class="w-full h-full object-cover" style="transform: scale(1.1) translateY(12px);" alt="Profile Default">
          </div>
          
          <!-- Functional Camera Button Component in view profile mode -->
          <div (click)="triggerGallery(fileInput)" class="absolute bottom-[-12px] left-1/2 -translate-x-1/2 w-[70px] h-[70px] bg-white rounded-full flex items-center justify-center z-20 cursor-pointer active:scale-95 transition-transform">
            <svg class="w-[30px] h-[30px] text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 47.774 47.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Z" />
            </svg>
          </div>
        </div>

        <div class="flex-1 flex flex-col justify-center" style="font-family: 'IBM Plex Serif', serif;">
          <h1 class="text-[36px] font-semibold text-black tracking-normal mb-2 leading-[150%] align-middle">
            {{ userName }}
          </h1>
          
          <div class="mb-6 flex gap-3 items-center">
            <span class="px-[24px] py-[6px] text-[#717182] font-normal text-[20px] leading-[150%] bg-[#717182]/15 rounded-full h-[38px] flex items-center justify-center align-middle" style="font-family: 'IBM Plex Serif', serif;">
              {{ userRoll }}
            </span>

            <span class="px-[24px] py-[6px] text-[#26C0AB] font-normal text-[20px] leading-[150%] bg-[#26C0AB]/10 rounded-full h-[38px] flex items-center justify-center align-middle" style="font-family: 'IBM Plex Serif', serif;">
              {{ userDept }}
            </span>
          </div>

          <div class="w-full flex flex-col">
            
            <div class="w-full border-t border-gray-200/80"></div>

            <div class="py-4 flex items-center justify-between w-full">
              <div class="flex items-center">
                <div class="w-[56px] h-[56px] rounded-full border border-[#26C0AB] flex items-center justify-center text-[#26C0AB] mr-5 shrink-0" style="background-color: rgba(38, 192, 171, 0.05);">
                  <svg class="w-[28px] h-[28px]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                  </svg>
                </div>
                <span class="text-[#717182] font-medium text-[24px] w-[140px] leading-[150%]">Email</span>
              </div>
              <span class="text-gray-900 font-medium tracking-normal text-left flex-1 pl-4 text-[20px]">{{ userEmail }}</span>
            </div>

            <div class="w-full border-t border-gray-200/80"></div>

            <div class="py-4 flex items-center justify-between w-full">
              <div class="flex items-center">
                <div class="w-[56px] h-[56px] rounded-full border border-[#26C0AB] flex items-center justify-center text-[#26C0AB] mr-5 shrink-0" style="background-color: rgba(38, 192, 171, 0.05);">
                  <svg class="w-[26px] h-[26px]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                  </svg>
                </div>
                <span class="text-[#717182] font-medium text-[24px] w-[140px] leading-[150%]">Joined On</span>
              </div>
              <span class="text-gray-900 font-medium tracking-normal text-left flex-1 pl-4 text-[20px]">{{ userJoinedDate }}</span>
            </div>

            <div class="w-full border-t border-gray-200/80"></div>

          </div>
        </div>
      </section>

      <!-- Updated Counter Stats Section matching image_4de783.png proportions -->
      <section class="grid grid-cols-3 gap-6" style="font-family: 'IBM Plex Serif', serif;">
        <div class="border border-gray-100 bg-white rounded-[20px] p-6 flex items-center gap-5 shadow-sm">
          <div class="w-[74px] h-[74px] bg-[#26C0AB]/10 rounded-full flex items-center justify-center shrink-0">
            <div class="w-[56px] h-[56px] bg-[#26C0AB] rounded-full flex items-center justify-center text-white">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" />
              </svg>
            </div>
          </div>
          <div>
            <div class="text-[32px] font-bold text-black leading-tight">4</div>
            <div class="text-black text-[15px] font-medium tracking-wide">Products Listed</div>
          </div>
        </div>

        <div class="border border-gray-100 bg-white rounded-[20px] p-6 flex items-center gap-5 shadow-sm">
          <div class="w-[74px] h-[74px] bg-[#26C0AB]/10 rounded-full flex items-center justify-center shrink-0">
            <div class="w-[56px] h-[56px] bg-[#26C0AB] rounded-full flex items-center justify-center text-white">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
              </svg>
            </div>
          </div>
          <div>
            <div class="text-[32px] font-bold text-black leading-tight">1</div>
            <div class="text-black text-[15px] font-medium tracking-wide">Products Sold</div>
          </div>
        </div>

        <div class="border border-gray-100 bg-white rounded-[20px] p-6 flex items-center gap-5 shadow-sm">
          <div class="w-[74px] h-[74px] bg-[#26C0AB]/10 rounded-full flex items-center justify-center shrink-0">
            <div class="w-[56px] h-[56px] bg-[#26C0AB] rounded-full flex items-center justify-center text-white">
              <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                <path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z" />
              </svg>
            </div>
          </div>
          <div>
            <div class="text-[32px] font-bold text-black leading-tight">2</div>
            <div class="text-black text-[15px] font-medium tracking-wide">Wishlist Items</div>
          </div>
        </div>
      </section>

      <section class="border border-gray-200 bg-white rounded-[24px] p-8 space-y-6 shadow-sm">
        <div class="flex items-center justify-between px-2">
          <h2 class="text-[32px] font-bold text-black tracking-tight" style="font-family: 'IBM Plex Serif', serif;">Recent Listing</h2>
          <a href="#" class="text-[#2FA084] font-semibold text-[18px] flex items-center gap-1 hover:opacity-80" style="font-family: 'Inter', sans-serif;">
            View all <span class="text-[20px] font-light leading-none -mt-0.5">&rsaquo;</span>
          </a>
        </div>

        <div class="grid grid-cols-3 gap-8" style="font-family: 'IBM Plex Serif', serif;">
          
          <!-- Product Card 1 -->
          <div class="border-2 border-[#2FA08466] rounded-[18px] bg-white p-6 h-[440px] flex flex-col justify-between relative group">
            <button class="absolute top-6 right-6 text-black hover:opacity-70">
              <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
              </svg>
            </button>
            <div class="h-[220px] w-full flex items-center justify-center p-2 mt-4 bg-white rounded-xl">
              <img src="assets/iphone16.png" alt="iPhone 16" class="max-h-full max-w-full object-contain">
            </div>
            <div class="space-y-4 pb-2">
              <h3 class="text-black text-[16px] font-medium tracking-tight">iPhone 16</h3>
              <div class="text-[#2FA084] font-bold text-[18px]">₹69,900</div>
            </div>
          </div>

          <!-- Product Card 2 -->
          <div class="border-2 border-[#2FA08466] rounded-[18px] bg-white p-6 h-[440px] flex flex-col justify-between relative group">
            <button class="absolute top-6 right-6 text-black hover:opacity-70">
              <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
              </svg>
            </button>
            <div class="h-[220px] w-full flex items-center justify-center p-2 mt-4 bg-white rounded-xl">
              <img src="assets/apple iphone 11.png" alt="Apple iPhone 11" class="max-h-full max-w-full object-contain">
            </div>
            <div class="space-y-4 pb-2">
              <h3 class="text-black text-[16px] font-medium tracking-tight">Apple iPhone 11</h3>
              <div class="text-[#2FA084] font-bold text-[18px]">₹27,100</div>
            </div>
          </div>

          <!-- Product Card 3 -->
          <div class="border-2 border-[#2FA08466] rounded-[18px] bg-white p-6 h-[440px] flex flex-col justify-between relative group">
            <button class="absolute top-6 right-6 text-black hover:opacity-70">
              <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
              </svg>
            </button>
            <div class="h-[220px] w-full flex items-center justify-center p-2 mt-4 bg-gray-50/30 rounded-xl">
              <img src="assets/apple macbook.png" alt="Apple MacBook Air M2" class="max-h-full max-w-full object-contain">
            </div>
            <div class="space-y-4 pb-2">
              <h3 class="text-black text-[16px] font-medium tracking-tight">Apple MacBook Air M2</h3>
              <div class="text-[#2FA084] font-bold text-[18px]">₹72,500</div>
            </div>
          </div>

        </div>
      </section>
    </main>
  </ng-container>
</div>
