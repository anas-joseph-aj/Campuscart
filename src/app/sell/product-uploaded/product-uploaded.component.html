<div class="min-h-screen flex items-center justify-center bg-gray-50 p-4">
  <div class="w-full max-w-xl bg-white border border-teal-200 rounded-2xl p-8 md:p-12 shadow-sm text-center flex flex-col items-center">
    
    <div class="relative w-full max-w-[280px] h-44 flex items-center justify-center mb-6">
      <img src="assets/productuploaded.png" alt="Product Uploaded Successfully" class="w-auto h-full object-contain mx-auto">
    </div>

    <h1 class="text-2xl md:text-3xl font-serif font-bold text-gray-900 mb-3">
      Product Uploaded Successfully!
    </h1>
    <p class="text-sm md:text-base text-gray-500 max-w-sm mb-10 leading-relaxed">
      Your product has been listed on CampusCart.<br>
      It is now live and visible to other users.
    </p>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 w-full mb-8">
      
      <button (click)="navigateTo('view-product')" 
              class="flex items-center justify-center gap-2 border border-teal-200 bg-teal-50 bg-opacity-30 hover:bg-teal-50 text-teal-600 font-medium px-4 py-2.5 rounded-lg transition-colors text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        View Product
      </button>

      <button (click)="navigateTo('my-listings')" 
              class="flex items-center justify-center gap-2 border border-teal-200 bg-teal-50 bg-opacity-30 hover:bg-teal-50 text-teal-600 font-medium px-4 py-2.5 rounded-lg transition-colors text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" />
        </svg>
        My Listings
      </button>

      <button (click)="navigateTo('list-another')" 
              class="flex items-center justify-center gap-2 border border-teal-200 bg-teal-50 bg-opacity-30 hover:bg-teal-50 text-teal-600 font-medium px-4 py-2.5 rounded-lg transition-colors text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        List Another Product
      </button>

    </div>

    <button (click)="navigateTo('home')" 
            class="group inline-flex items-center gap-1 text-gray-800 hover:text-black font-semibold text-sm transition-colors">
      Go to Home
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3 h-3 transform group-hover:translate-x-0.5 transition-transform">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
      </svg>
    </button>

  </div>
</div>
