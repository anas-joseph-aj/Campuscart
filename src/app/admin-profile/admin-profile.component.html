<div class="min-h-screen flex flex-col bg-slate-50 relative">

    <div *ngIf="isSuccessNotificationOpen"
        class="fixed top-24 right-12 z-50 max-w-md bg-emerald-50 border border-emerald-200 rounded-xl p-4 shadow-lg flex items-start gap-3 animate-in slide-in-from-top-4 duration-300">
        <div class="text-emerald-500 shrink-0 mt-0.5">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>
        <div class="flex-1">
            <p class="text-sm font-medium text-emerald-800 font-sans">{{ notificationMessage }}</p>
        </div>
        <button (click)="isSuccessNotificationOpen = false"
            class="text-emerald-400 hover:text-emerald-600 p-0.5 rounded transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    <header
        class="fixed top-0 left-0 z-50 w-full h-[77px] px-12 flex items-center justify-between border-b-2 border-[#E5E7EB] bg-white shrink-0"
        style="font-family: 'Inter', sans-serif;">

        <div class="flex items-center">
            <img src="assets/logo.png" alt="CampusCart" class="h-[50px] w-auto object-contain">
        </div>

        <nav class="flex gap-8 text-[#6C757D] font-medium text-[14px]">
            <a routerLink="/home" class="hover:text-[#2BAE96] transition-colors cursor-pointer">Home</a>
            <a routerLink="/categories" class="hover:text-[#2BAE96] transition-colors cursor-pointer">Categories</a>
            <a routerLink="/products" class="hover:text-[#2BAE96] transition-colors cursor-pointer">All Products</a>
        </nav>

        <div class="flex items-center gap-6">
            <div class="flex items-center gap-4 text-[#6C757D]">
                <a routerLink="/admin-profile" routerLinkActive="text-[#2BAE96]"
                    class="hover:text-gray-900 flex items-center transition-colors focus:outline-none cursor-pointer">
                    <svg class="w-6 h-6 hover:text-[#2FA084]" fill="none" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z">
                        </path>
                    </svg>
                </a>
            </div>

            <button routerLink="/"
                class="flex items-center gap-2 px-4 py-2 rounded-lg hover:opacity-90 transition cursor-pointer"
                style="background-color: #FFC9C9; color: #FB2C36;">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                    </path>
                </svg>
                <span class="font-semibold text-[14px]">Logout</span>
            </button>
        </div>
        <div class="absolute bottom-0 left-0 w-full h-[2px] bg-[#2BAE96]"></div>
    </header>

    <div class="w-full flex flex-1 min-h-0 mt-[77px]">

        <aside
            class="group w-[76px] hover:w-[260px] min-h-[calc(100vh-77px)] p-4 flex flex-col gap-6 shrink-0 text-white shadow-lg transition-all duration-300 ease-in-out overflow-x-hidden z-20 sticky top-[77px]"
            style="background-color: #2BAE96; font-family: 'IBM Plex Serif', serif;">

            <div class="pt-2">
                <a routerLink="/admin-dashboard"
                    class="w-full h-[48px] px-3 rounded-[10px] flex items-center justify-start gap-4 text-[16px] tracking-wide transition-all overflow-hidden whitespace-nowrap no-underline border-none outline-none text-white hover:bg-white hover:text-[#2BAE96] font-normal group/btn">
                    <div
                        class="shrink-0 w-[22px] h-[22px] flex items-center justify-center mx-auto group-hover:mx-0 transition-all duration-200">
                        <svg class="w-[22px] h-[22px] fill-none stroke-current text-white group-hover/btn:text-[#2BAE96] transition-colors"
                            stroke-width="1.8" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10z" />
                            <path d="M9 21V12h6v9" />
                        </svg>
                    </div>
                    <span class="hidden group-hover:block transition-all duration-200">Dashboard</span>
                </a>
            </div>

            <div class="flex flex-col gap-2">
                <span
                    class="text-[14px] font-bold text-white/50 tracking-wider px-3 mb-1 hidden group-hover:block whitespace-nowrap">MAIN</span>

                <a routerLink="/admin-users"
                    class="w-full h-[44px] px-3 rounded-[10px] flex items-center justify-start gap-4 text-[16px] transition-all no-underline text-white hover:bg-white hover:text-[#2BAE96] font-normal border-none outline-none overflow-hidden whitespace-nowrap group/btn">
                    <div
                        class="shrink-0 w-[22px] h-[22px] flex items-center justify-center mx-auto group-hover:mx-0 transition-all duration-200">
                        <svg class="w-[22px] h-[22px] fill-none stroke-current text-white group-hover/btn:text-[#2BAE96] transition-colors"
                            stroke-width="1.8" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="8.5" cy="7" r="3.5" />
                            <path d="M1 20v-1a4 4 0 0 1 4-4h7a4 4 0 0 1 4 4v1" />
                            <path d="M15.5 4.5a3.5 3.5 0 0 1 0 5" />
                            <path d="M19 15a4 4 0 0 1 2 2v3" />
                        </svg>
                    </div>
                    <span class="hidden group-hover:block transition-all duration-200">Users</span>
                </a>

                <a routerLink="/admin-categories"
                    class="w-full h-[44px] px-3 rounded-[10px] flex items-center justify-start gap-4 text-[16px] transition-all no-underline text-white hover:bg-white hover:text-[#2BAE96] font-normal border-none outline-none overflow-hidden whitespace-nowrap group/btn">
                    <div
                        class="shrink-0 w-[22px] h-[22px] flex items-center justify-center mx-auto group-hover:mx-0 transition-all duration-200">
                        <svg class="w-[20px] h-[20px] fill-none stroke-current text-white group-hover/btn:text-[#2BAE96] transition-colors"
                            stroke-width="1.8" viewBox="0 0 24 24">
                            <rect x="3" y="3" width="7" height="7" />
                            <rect x="14" y="3" width="7" height="7" />
                            <rect x="3" y="14" width="7" height="7" />
                            <rect x="14" y="14" width="7" height="7" />
                        </svg>
                    </div>
                    <span class="hidden group-hover:block transition-all duration-200">Categories</span>
                </a>

                <a routerLink="/admin-products"
                    class="w-full h-[44px] px-3 rounded-[10px] flex items-center justify-start gap-4 text-[16px] transition-all no-underline text-white hover:bg-white hover:text-[#2BAE96] font-normal border-none outline-none overflow-hidden whitespace-nowrap group/btn">
                    <div
                        class="shrink-0 w-[22px] h-[22px] flex items-center justify-center mx-auto group-hover:mx-0 transition-all duration-200">
                        <svg class="w-[22px] h-[22px] fill-none stroke-current text-white group-hover/btn:text-[#2BAE96] transition-colors"
                            stroke-width="1.8" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 8h16l-1.5 12H5.5L4 8z" />
                            <path d="M9 8V6a3 3 0 0 1 6 0v2" />
                            <path d="M8 12a4 4 0 0 0 8 0" />
                        </svg>
                    </div>
                    <span class="hidden group-hover:block transition-all duration-200">Products</span>
                </a>
            </div>

            <div class="flex flex-col gap-2">
                <span
                    class="text-[14px] font-bold text-white/50 tracking-wider px-3 mb-1 hidden group-hover:block whitespace-nowrap">CONTENT</span>

                <a routerLink="/admin-reviews"
                    class="w-full h-[44px] px-3 rounded-[10px] flex items-center justify-start gap-4 text-[16px] transition-all no-underline text-white hover:bg-white hover:text-[#2BAE96] font-normal border-none outline-none overflow-hidden whitespace-nowrap group/btn">
                    <div
                        class="shrink-0 w-[24px] h-[24px] relative flex items-center justify-center mx-auto group-hover:mx-0 transition-all duration-200">
                        <div class="w-[22px] h-[22px] relative">
                            <svg class="w-[14px] h-[14px] absolute bottom-0 left-0 fill-none stroke-current text-white group-hover/btn:text-[#2BAE96] transition-colors"
                                stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3" />
                            </svg>
                            <svg class="w-[14px] h-[14px] absolute top-0 right-0 fill-none stroke-current text-white group-hover/btn:text-[#2BAE96] transition-colors"
                                stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3" />
                            </svg>
                        </div>
                    </div>
                    <span class="hidden group-hover:block transition-all duration-200">Reviews</span>
                </a>
            </div>

            <div class="flex flex-col gap-2">
                <span
                    class="text-[14px] font-bold text-white/50 tracking-wider px-3 mb-1 hidden group-hover:block whitespace-nowrap">MODERATION</span>

                <a routerLink="/admin-analytics"
                    class="w-full h-[44px] px-3 rounded-[10px] flex items-center justify-start gap-4 text-[16px] transition-all no-underline text-white hover:bg-white hover:text-[#2BAE96] font-normal border-none outline-none overflow-hidden whitespace-nowrap group/btn">
                    <div
                        class="shrink-0 w-[22px] h-[22px] flex items-center justify-center mx-auto group-hover:mx-0 transition-all duration-200">
                        <svg class="w-[22px] h-[22px] fill-none stroke-current text-white group-hover/btn:text-[#2BAE96] transition-colors"
                            stroke-width="1.8" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 3v18h18" />
                            <path d="M7 16v-4" />
                            <path d="M12 16V9" />
                            <path d="M17 16V6" />
                        </svg>
                    </div>
                    <span class="hidden group-hover:block transition-all duration-200">Analytics</span>
                </a>
            </div>
        </aside>

        <main class="flex-1 p-8 bg-slate-50 overflow-y-auto">
            <div class="max-w-5xl mx-auto">

                <h1 class="text-xl font-bold text-[#1E293B] mb-8 tracking-wide font-serif">Admin Profile</h1>

                <div
                    class="bg-white rounded-2xl border border-gray-100 shadow-xs grid grid-cols-1 md:grid-cols-3 min-h-[460px] overflow-hidden">

                    <div
                        class="flex flex-col items-center justify-center border-b md:border-b-0 md:border-r border-gray-150 p-8 bg-gray-50/30">
                        <div
                            class="w-24 h-24 bg-[#EAF7F5] rounded-full flex items-center justify-center text-[#2BAE96] mb-4 shadow-2xs">
                            <svg class="w-12 h-12" fill="currentColor" viewBox="0 0 24 24">
                                <path fill-rule="evenodd"
                                    d="M7.5 6a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM3.751 20.105a8.25 8.25 0 0116.498 0 .75.75 0 01-.437.695A18.683 18.683 0 0112 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 01-.437-.695z"
                                    clip-rule="evenodd" />
                            </svg>
                        </div>
                        <h2 class="text-base font-bold text-[#1E293B] tracking-wide font-serif">{{ adminProfile.name }}
                        </h2>
                    </div>

                    <div class="md:col-span-2 p-8 flex flex-col justify-between space-y-6">

                        <div class="space-y-5">
                            <div class="space-y-1.5">
                                <label
                                    class="block text-sm font-bold text-gray-600 tracking-wide font-serif">Name</label>
                                <input type="text" [(ngModel)]="adminProfile.name"
                                    class="w-full bg-[#F8FAFC] border border-gray-200 rounded-lg h-[44px] px-4 text-[14px] text-gray-700 font-medium focus:outline-none focus:border-[#2BAE96] focus:bg-white transition font-serif" />
                            </div>

                            <div class="space-y-1.5">
                                <label
                                    class="block text-sm font-bold text-gray-600 tracking-wide font-serif">Email</label>
                                <input type="email" [(ngModel)]="adminProfile.email"
                                    class="w-full bg-[#F8FAFC] border border-gray-200 rounded-lg h-[44px] px-4 text-[14px] text-gray-700 font-medium focus:outline-none focus:border-[#2BAE96] focus:bg-white transition font-serif" />
                            </div>

                            <div class="space-y-1.5 relative">
                                <label
                                    class="block text-sm font-bold text-gray-600 tracking-wide font-serif">Password</label>
                                <div class="relative">
                                    <input type="password" [value]="adminProfile.passwordText" disabled
                                        class="w-full bg-[#F8FAFC]/60 border border-gray-200 rounded-lg h-[44px] px-4 text-[14px] text-gray-400 tracking-widest cursor-not-allowed select-none" />
                                </div>
                            </div>

                            <div class="pt-1">
                                <button type="button" (click)="isChangePasswordModalOpen = true"
                                    class="px-4 py-2 border border-gray-300 rounded-lg text-xs font-semibold text-gray-600 hover:bg-gray-50 transition focus:outline-none shadow-3xs font-serif">
                                    Change Password
                                </button>
                            </div>
                        </div>

                        <div class="pt-6 space-y-3">
                            <button type="button" (click)="onSaveChanges()"
                                class="w-full bg-[#2BAE96] hover:bg-[#228d7a] text-white text-[15px] font-semibold h-[46px] rounded-lg shadow-sm transition focus:outline-none tracking-wide font-serif">
                                Save Changes
                            </button>

                            <div *ngIf="isProfileSavedMessageVisible"
                                class="text-center text-[14px] font-semibold text-emerald-600 transition-all duration-300 animate-in fade-in">
                                Profile Saved Successfully!
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </main>

    </div>

    <div *ngIf="isChangePasswordModalOpen"
        class="fixed inset-0 z-50 flex items-center justify-center p-4 overflow-x-hidden overflow-y-auto">

        <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs transition-opacity"
            (click)="isChangePasswordModalOpen = false"></div>

        <div
            class="bg-white w-full max-w-md rounded-2xl border border-gray-100 shadow-xl z-10 overflow-hidden transform transition-all p-6 space-y-6 animate-in fade-in zoom-in-95 duration-200">

            <div class="flex items-center justify-between border-b border-gray-100 pb-3">
                <h3 class="text-lg font-bold text-[#1E293B] font-serif">Update Password</h3>
                <button type="button" (click)="isChangePasswordModalOpen = false"
                    class="text-gray-400 hover:text-gray-600 p-1 rounded-lg transition hover:bg-gray-50 focus:outline-none">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div class="space-y-4">
                <div class="space-y-3">
                    <label class="block text-xs font-bold text-gray-500 tracking-wide font-serif">New Password (6
                        Digits)</label>

                    <div class="flex justify-between items-center gap-2">
                        <input *ngFor="let box of [0,1,2,3,4,5]; let i = index" id="pin-box-{{i}}"
                            [type]="isPasswordVisible ? 'text' : 'password'" [value]="getPinDigit(i)"
                            (keydown)="handlePinKeyDown($event, i)" (keypress)="blockNonNumbers($event)" maxlength="1"
                            inputmode="numeric" pattern="[0-9]*"
                            class="w-[52px] h-[64px] bg-[#F8FAFC] border-2 border-[#2BAE96]/20 rounded-xl text-center text-xl font-bold text-gray-800 focus:outline-none focus:border-[#2BAE96] focus:bg-white transition shadow-2xs" />

                        <button type="button" (click)="togglePasswordVisibility()"
                            class="text-gray-400 hover:text-gray-600 focus:outline-none p-2 ml-1">
                            <svg *ngIf="!isPasswordVisible" class="w-5 h-5" fill="none" stroke="currentColor"
                                stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                            <svg *ngIf="isPasswordVisible" class="w-5 h-5" fill="none" stroke="currentColor"
                                stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-end gap-3 pt-2">
                <button type="button" (click)="isChangePasswordModalOpen = false"
                    class="px-4 h-[40px] border border-gray-300 rounded-lg text-sm font-semibold text-gray-600 hover:bg-gray-50 transition focus:outline-none font-serif">
                    Cancel
                </button>
                <button type="button" (click)="onChangePasswordClick(); isChangePasswordModalOpen = false"
                    [disabled]="adminProfile.passwordText.length !== 6"
                    class="px-5 h-[40px] bg-[#2BAE96] hover:bg-[#228d7a] text-white text-sm font-semibold rounded-lg shadow-xs transition focus:outline-none font-serif disabled:opacity-50 disabled:cursor-not-allowed">
                    Confirm Update
                </button>
            </div>
        </div>
    </div>
</div>
